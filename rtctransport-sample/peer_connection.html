<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeerConnection Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; padding: 16px; background: #f5f5f5; color: #222; font-size: 14px; }
    h1 { font-size: 1.3em; font-weight: 600; margin-bottom: 12px; }
    .app { max-width: 1100px; margin: 0 auto; }

    /* Panels */
    .panel { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 14px; margin-bottom: 12px; }
    .panel h2 { font-size: 0.95em; font-weight: 600; margin-bottom: 10px; color: #444; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Settings row */
    .settings-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .settings-row label { font-size: 0.85em; color: #555; }
    .settings-row select, .settings-row input {
      padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 0.85em; background: #fff; color: #222;
    }
    .settings-row input { width: 120px; }

    /* Buttons */
    .btn-group { display: flex; gap: 6px; margin-top: 10px; }
    button {
      padding: 6px 14px; border: 1px solid #999; border-radius: 4px;
      background: #fff; cursor: pointer; font-size: 0.85em; font-weight: 500;
    }
    button:hover { background: #eee; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.ghost { border: 1px solid #bbb; background: transparent; font-size: 0.8em; }

    /* State */
    .state { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 0.8em; font-weight: 600; }
    .state-idle { background: #e5e7eb; color: #666; }
    .state-connecting { background: #fef3c7; color: #92400e; }
    .state-connected { background: #d1fae5; color: #065f46; }

    /* Video grid */
    .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 640px) { .video-grid { grid-template-columns: 1fr; } }
    .video-box video, .video-box canvas { width: 100%; background: #111; border-radius: 4px; display: block; }
    .video-box .label { font-size: 0.8em; color: #888; margin-bottom: 4px; }

    /* Stats */
    .stats-sections { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .stats-sections { grid-template-columns: 1fr; gap: 10px; } }
    .stats-section-title { font-size: 0.82em; font-weight: 600; color: #666; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
    .stats-grid { font-size: 0.82em; }
    .stat-item { display: flex; justify-content: space-between; padding: 2px 0; }
    .stat-label { color: #888; }
    .stat-value { font-weight: 500; font-variant-numeric: tabular-nums; }

    /* Graphs */
    .graphs-panel { display: none; }
    .graphs-panel.visible { display: block; }
    .graphs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
    .graph-box canvas { width: 100%; height: 100px; border: 1px solid #e5e7eb; border-radius: 4px; background: #fafafa; }
    .graph-box .label { font-size: 0.75em; color: #888; margin-bottom: 2px; }

    /* Log */
    .log-panel { max-height: 200px; overflow-y: auto; font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.78em; line-height: 1.5; background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 8px; }
    .log-panel div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-warn { color: #b45309; }
    .log-error { color: #dc2626; }

    .panel[hidden] { display: none; }
    .state-badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 0.8em; font-weight: 600; }
    .readonly-input[readonly] { background: #f8f8f8; color: #555; }
  </style>
</head>
<body>
  <div class="app">
    <header class="panel">
      <h1>PeerConnection Client</h1>
    </header>

    <section class="panel">
      <h2>Settings</h2>
      <div class="settings-row">
        <label>
          Room
          <input type="text" id="roomInput" value="test-room">
        </label>
        <label>
          Video codec
          <select id="videoCodec">
            <option value="vp8">VP8</option>
            <option value="vp9" selected>VP9</option>
            <option value="h264">H.264</option>
            <option value="hevc">HEVC</option>
            <option value="av1">AV1</option>
          </select>
        </label>
        <label>
          Audio codec
          <select id="audioCodec">
            <option value="opus" selected>Opus</option>
            <option value="aac">AAC-LC</option>
            <option value="pcmu">G.711 µ-law (PCMU)</option>
            <option value="pcma">G.711 A-law (PCMA)</option>
          </select>
        </label>
        <label>
          Resolution
          <select id="resolution">
            <option value="320x240">QVGA (320×240)</option>
            <option value="640x480" selected>VGA (640×480)</option>
            <option value="854x480">SD (854×480)</option>
            <option value="1280x720">HD (1280×720)</option>
          </select>
        </label>
        <div>
          <div class="label">State</div>
          <span id="status" class="state state-idle">Idle</span>
        </div>
      </div>
      <div class="btn-group">
        <button id="btnJoin">Join</button>
        <button id="btnCall" disabled>Call</button>
        <button id="btnHangup" disabled>Hang Up</button>
      </div>
    </section>

    <section class="panel">
      <h2>Video</h2>
      <div class="video-grid">
        <div class="video-box">
          <div class="label">Local</div>
          <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div class="video-box">
          <div class="label">Remote</div>
          <video id="remoteVideo" autoplay playsinline></video>
        </div>
      </div>
      <audio id="remoteAudio" autoplay hidden></audio>
    </section>

    <section id="statsPanel" class="panel" hidden>
      <h2>Stats</h2>
      <div id="stats"></div>
      <div class="btn-group">
        <button id="btnToggleGraphs" class="ghost" type="button">Show Graphs</button>
      </div>
    </section>

    <section id="graphsPanel" class="panel graphs-panel">
      <h2>Graphs</h2>
      <div class="graphs-grid">
        <div class="graph-box">
          <div class="label">Bitrate over time</div>
          <canvas id="graphBitrate"></canvas>
        </div>
        <div class="graph-box">
          <div class="label">QP over time</div>
          <canvas id="graphQp"></canvas>
        </div>
        <div class="graph-box">
          <div class="label">Packet loss over time</div>
          <canvas id="graphLoss"></canvas>
        </div>
        <div class="graph-box">
          <div class="label">Jitter over time</div>
          <canvas id="graphJitter"></canvas>
        </div>
        <div class="graph-box">
          <div class="label">Resolution over time</div>
          <canvas id="graphResolution"></canvas>
        </div>
        <div class="graph-box">
          <div class="label">FPS over time</div>
          <canvas id="graphFps"></canvas>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Log</h2>
      <div id="log" class="log-panel"></div>
    </section>
  </div>

  <script type="module">
    const roomInput = document.getElementById('roomInput');
    const btnJoin = document.getElementById('btnJoin');
    const btnCall = document.getElementById('btnCall');
    const btnHangup = document.getElementById('btnHangup');
    const statusEl = document.getElementById('status');
    const statsEl = document.getElementById('stats');
    const statsPanelEl = document.getElementById('statsPanel');
    const logEl = document.getElementById('log');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const remoteAudio = document.getElementById('remoteAudio');
    const resolutionEl = document.getElementById('resolution');
    const videoCodecEl = document.getElementById('videoCodec');
    const audioCodecEl = document.getElementById('audioCodec');
    const btnToggleGraphs = document.getElementById('btnToggleGraphs');
    const graphsPanelEl = document.getElementById('graphsPanel');
    const graphBitrateEl = document.getElementById('graphBitrate');
    const graphQpEl = document.getElementById('graphQp');
    const graphLossEl = document.getElementById('graphLoss');
    const graphJitterEl = document.getElementById('graphJitter');
    const graphResolutionEl = document.getElementById('graphResolution');
    const graphFpsEl = document.getElementById('graphFps');

    const RESOLUTIONS = {
      '320x240': {label: 'QVGA', width: 320, height: 240},
      '640x480': {label: 'VGA', width: 640, height: 480},
      '854x480': {label: 'SD', width: 854, height: 480},
      '1280x720': {label: 'HD', width: 1280, height: 720},
    };

    const CODEC_OPTIONS = {
      audio: {
        opus: {mimeType: 'audio/opus', token: 'opus'},
        aac: {mimeType: 'audio/mp4a-latm', token: 'mp4a'},
        pcma: {mimeType: 'audio/PCMA', token: 'pcma'},
        pcmu: {mimeType: 'audio/PCMU', token: 'pcmu'},
      },
      video: {
        av1: {mimeType: 'video/AV1', token: 'av1'},
        h264: {mimeType: 'video/H264', token: 'h264'},
        hevc: {mimeType: 'video/HEVC', token: 'hevc'},
        vp8: {mimeType: 'video/VP8', token: 'vp8'},
        vp9: {mimeType: 'video/VP9', token: 'vp9'},
      },
    };

    let ws = null;
    let pc = null;
    let localStream = null;
    let peerId = null;
    let remotePeerId = null;
    let joinedRoom = false;
    let pendingCandidates = [];
    let remoteDescriptionSet = false;
    let statsInterval = null;
    let statsBaseline = null;
    let graphsVisible = false;
    let graphFrame = 0;

    const bitrateHistory = [];
    const qpHistory = [];
    const lossHistory = [];
    const jitterHistory = [];
    const resolutionHistory = [];
    const fpsHistory = [];

    function drawGraph(canvas, dataPoints, label, unit, maxVal) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width = canvas.offsetWidth * (window.devicePixelRatio || 1);
      const h = canvas.height = canvas.offsetHeight * (window.devicePixelRatio || 1);
      ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
      const dw = canvas.offsetWidth;
      const dh = canvas.offsetHeight;

      ctx.clearRect(0, 0, dw, dh);

      if (dataPoints.length < 2) {
        ctx.fillStyle = '#aaa';
        ctx.font = '11px system-ui';
        ctx.fillText('Waiting for data...', 10, dh / 2);
        return;
      }

      const max = maxVal || Math.max(...dataPoints, 1);
      const step = dw / (60 - 1);

      ctx.strokeStyle = '#eee';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = (dh - 20) * (i / 4) + 4;
        ctx.beginPath();
        ctx.moveTo(30, y);
        ctx.lineTo(dw, y);
        ctx.stroke();
      }

      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      const len = Math.min(dataPoints.length, 60);
      const startIdx = Math.max(0, dataPoints.length - 60);
      for (let i = 0; i < len; i++) {
        const x = 30 + i * step;
        const y = 4 + (dh - 24) * (1 - dataPoints[startIdx + i] / max);
        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.stroke();

      ctx.fillStyle = '#888';
      ctx.font = '10px system-ui';
      ctx.fillText(label, 2, 12);
      ctx.fillText(`${Math.round(max)}${unit}`, 2, dh - 4);
      ctx.fillText('0', 2, dh - 14);

      const current = dataPoints[dataPoints.length - 1];
      ctx.fillStyle = '#222';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'right';
      ctx.fillText(`${Math.round(current)}${unit}`, dw - 4, 12);
      ctx.textAlign = 'left';
    }

    function pushHistory(target, value) {
      target.push(Number.isFinite(value) ? value : 0);
      if (target.length > 60) {
        target.shift();
      }
    }

    function renderGraphs() {
      if (!graphsVisible) {
        graphFrame = 0;
        return;
      }
      drawGraph(graphBitrateEl, bitrateHistory, 'Bitrate', 'kbps');
      drawGraph(graphQpEl, qpHistory, 'QP', '', 51);
      drawGraph(graphLossEl, lossHistory, 'Loss', '%', 10);
      drawGraph(graphJitterEl, jitterHistory, 'Jitter', 'ms', 100);
      drawGraph(graphResolutionEl, resolutionHistory, 'Resolution (kpx)', '');
      drawGraph(graphFpsEl, fpsHistory, 'FPS', '', 60);
      graphFrame = window.requestAnimationFrame(renderGraphs);
    }

    function log(message, level = 'info') {
      const entry = document.createElement('div');
      if (level === 'warn') {
        entry.className = 'log-warn';
      } else if (level === 'error') {
        entry.className = 'log-error';
      }
      entry.textContent =
          `[${new Date().toLocaleTimeString()}] [${level.toUpperCase()}] ${message}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;

      if (level === 'error') {
        console.error(`[PeerC] ${message}`);
      } else if (level === 'warn') {
        console.warn(`[PeerC] ${message}`);
      } else {
        console.log(`[PeerC] ${message}`);
      }
    }

    function setStatus(text, tone) {
      statusEl.textContent = text;
      statusEl.className = `state state-${tone}`;
    }

    function getSelectedResolution() {
      return RESOLUTIONS[resolutionEl.value] || RESOLUTIONS['640x480'];
    }

    function getSelectedCodecConfig(kind) {
      const select = kind === 'video' ? videoCodecEl : audioCodecEl;
      return CODEC_OPTIONS[kind][select.value] || null;
    }

    function getTransceiverForKind(kind) {
      return pc.getTransceivers().find((transceiver) =>
        transceiver.sender.track?.kind === kind ||
        transceiver.receiver.track?.kind === kind);
    }

    function trySetCodecPreferences(kind) {
      const transceiver = getTransceiverForKind(kind);
      if (!transceiver || !transceiver.setCodecPreferences ||
          !window.RTCRtpReceiver?.getCapabilities) {
        return false;
      }

      const config = getSelectedCodecConfig(kind);
      const capabilities = RTCRtpReceiver.getCapabilities(kind);
      if (!config || !capabilities?.codecs?.length) {
        return false;
      }

      const preferred = capabilities.codecs.filter((codec) =>
        codec.mimeType.toLowerCase().includes(config.token));
      if (!preferred.length) {
        return false;
      }

      const rest = capabilities.codecs.filter((codec) =>
        !codec.mimeType.toLowerCase().includes(config.token));
      transceiver.setCodecPreferences([...preferred, ...rest]);
      return true;
    }

    function preferCodecInSdp(sdp, kind) {
      const config = getSelectedCodecConfig(kind);
      if (!config || !sdp) {
        return sdp;
      }

      const lines = sdp.split('\r\n');
      const mediaLineIndex = lines.findIndex((line) => line.startsWith(`m=${kind} `));
      if (mediaLineIndex === -1) {
        return sdp;
      }

      let sectionEnd = lines.length;
      for (let i = mediaLineIndex + 1; i < lines.length; i++) {
        if (lines[i].startsWith('m=')) {
          sectionEnd = i;
          break;
        }
      }

      const codecPayloads = new Set();
      const relatedPayloads = new Set();
      for (let i = mediaLineIndex + 1; i < sectionEnd; i++) {
        const rtpMapMatch = lines[i].match(/^a=rtpmap:(\d+)\s+([^/]+)/i);
        if (rtpMapMatch && rtpMapMatch[2].toLowerCase() === config.token) {
          codecPayloads.add(rtpMapMatch[1]);
        }
      }

      if (!codecPayloads.size) {
        return sdp;
      }

      for (let i = mediaLineIndex + 1; i < sectionEnd; i++) {
        const fmtpMatch = lines[i].match(/^a=fmtp:(\d+)\s+.*\bapt=(\d+)/i);
        if (fmtpMatch && codecPayloads.has(fmtpMatch[2])) {
          relatedPayloads.add(fmtpMatch[1]);
        }
      }

      const preferredPayloads = new Set([...codecPayloads, ...relatedPayloads]);
      const mediaParts = lines[mediaLineIndex].split(' ');
      const header = mediaParts.slice(0, 3);
      const payloads = mediaParts.slice(3);
      const reorderedPayloads = [
        ...payloads.filter((payload) => preferredPayloads.has(payload)),
        ...payloads.filter((payload) => !preferredPayloads.has(payload)),
      ];
      lines[mediaLineIndex] = [...header, ...reorderedPayloads].join(' ');
      return lines.join('\r\n');
    }

    function applyCodecPreferencesToDescription(description) {
      const appliedKinds = {
        audio: trySetCodecPreferences('audio'),
        video: trySetCodecPreferences('video'),
      };

      if (!description?.sdp) {
        return description;
      }

      let sdp = description.sdp;
      if (!appliedKinds.video) {
        sdp = preferCodecInSdp(sdp, 'video');
      }
      if (!appliedKinds.audio) {
        sdp = preferCodecInSdp(sdp, 'audio');
      }
      return {type: description.type, sdp};
    }

    async function acquireLocalStream() {
      if (localStream) {
        localStream.getTracks().forEach((track) => track.stop());
      }
      const resolution = getSelectedResolution();
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: {
          width: {ideal: resolution.width},
          height: {ideal: resolution.height},
        },
      });
      localVideo.srcObject = localStream;
      return localStream;
    }

    function resetStatsUi() {
      statsPanelEl.hidden = true;
      statsEl.innerHTML = '';
      statsBaseline = null;
      bitrateHistory.length = 0;
      qpHistory.length = 0;
      lossHistory.length = 0;
      jitterHistory.length = 0;
      resolutionHistory.length = 0;
      fpsHistory.length = 0;
      graphsVisible = false;
      graphsPanelEl.classList.remove('visible');
      btnToggleGraphs.textContent = 'Show Graphs';
      if (graphFrame) {
        window.cancelAnimationFrame(graphFrame);
        graphFrame = 0;
      }
    }

    function stopStatsPolling() {
      if (statsInterval) {
        clearInterval(statsInterval);
        statsInterval = null;
      }
    }

    function formatNumber(value) {
      if (!Number.isFinite(value)) {
        return '—';
      }
      return value.toLocaleString();
    }

    function formatResolution(width, height) {
      if (width && height) {
        return `${width}×${height}`;
      }
      const resolution = getSelectedResolution();
      return `${resolution.width}×${resolution.height}`;
    }

    function codecName(report, statsMap) {
      const codec = report && report.codecId ? statsMap.get(report.codecId) : null;
      if (!codec || !codec.mimeType) {
        return null;
      }
      return codec.mimeType.split('/')[1] || codec.mimeType;
    }

    function updateStatsDisplay(data) {
      statsEl.innerHTML = `
        <div class="stats-sections">
          <div>
            <h3 class="stats-section-title">Video</h3>
            <div class="stats-grid">
              <div class="stat-item"><span class="stat-label">Codec</span><span class="stat-value">${data.videoCodec || '—'}</span></div>
              <div class="stat-item"><span class="stat-label">Resolution</span><span class="stat-value">${data.resolution}</span></div>
              <div class="stat-item"><span class="stat-label">FPS</span><span class="stat-value">${Number.isFinite(data.fps) ? data.fps.toFixed(1) : '—'}</span></div>
              <div class="stat-item"><span class="stat-label">QP</span><span class="stat-value">${Number.isFinite(data.qp) ? Math.round(data.qp) : '—'}</span></div>
            </div>
          </div>
          <div>
            <h3 class="stats-section-title">Audio</h3>
            <div class="stats-grid">
              <div class="stat-item"><span class="stat-label">Codec</span><span class="stat-value">${data.audioCodec || '—'}</span></div>
              <div class="stat-item"><span class="stat-label">Pkts sent</span><span class="stat-value">${formatNumber(data.audioPacketsSent)}</span></div>
              <div class="stat-item"><span class="stat-label">Pkts recv</span><span class="stat-value">${formatNumber(data.audioPacketsRecv)}</span></div>
            </div>
          </div>
          <div>
            <h3 class="stats-section-title">Network</h3>
            <div class="stats-grid">
              <div class="stat-item"><span class="stat-label">Bitrate</span><span class="stat-value">${Number.isFinite(data.bitrateKbps) ? Math.round(data.bitrateKbps) + ' kbps' : '—'}</span></div>
              <div class="stat-item"><span class="stat-label">Pkts sent</span><span class="stat-value">${formatNumber(data.packetsSent)}</span></div>
              <div class="stat-item"><span class="stat-label">Pkts recv</span><span class="stat-value">${formatNumber(data.packetsReceived)}</span></div>
              <div class="stat-item"><span class="stat-label">Loss</span><span class="stat-value">${Number.isFinite(data.lossPercent) ? data.lossPercent.toFixed(1) + '%' : '—'}</span></div>
              <div class="stat-item"><span class="stat-label">Jitter</span><span class="stat-value">${Number.isFinite(data.jitterMs) ? data.jitterMs.toFixed(1) + ' ms' : '—'}</span></div>
              <div class="stat-item"><span class="stat-label">RTT</span><span class="stat-value">${Number.isFinite(data.rttMs) ? Math.round(data.rttMs) + ' ms' : '—'}</span></div>
            </div>
          </div>
        </div>
      `;
    }

    async function pollStats() {
      if (!pc || pc.connectionState !== 'connected') {
        return;
      }

      try {
        const stats = await pc.getStats();
        const statsMap = new Map();
        stats.forEach((report) => statsMap.set(report.id, report));

        let inboundVideo = null;
        let outboundVideo = null;
        let inboundAudio = null;
        let outboundAudio = null;
        let candidatePair = null;

        stats.forEach((report) => {
          if (report.type === 'inbound-rtp' && report.kind === 'video') {
            inboundVideo = report;
          } else if (report.type === 'outbound-rtp' && report.kind === 'video') {
            outboundVideo = report;
          } else if (report.type === 'inbound-rtp' && report.kind === 'audio') {
            inboundAudio = report;
          } else if (report.type === 'outbound-rtp' && report.kind === 'audio') {
            outboundAudio = report;
          } else if (
            report.type === 'candidate-pair' &&
            (report.selected || report.nominated || report.state === 'succeeded')
          ) {
            candidatePair = report;
          }
        });

        const bytesSent =
            (outboundVideo?.bytesSent || 0) + (outboundAudio?.bytesSent || 0);
        const bytesReceived =
            (inboundVideo?.bytesReceived || 0) + (inboundAudio?.bytesReceived || 0);
        const packetsSent =
            (outboundVideo?.packetsSent || 0) + (outboundAudio?.packetsSent || 0);
        const packetsReceived =
            (inboundVideo?.packetsReceived || 0) +
            (inboundAudio?.packetsReceived || 0);
        const packetsLost =
            Math.max(0, inboundVideo?.packetsLost || 0) +
            Math.max(0, inboundAudio?.packetsLost || 0);
        const fps =
            inboundVideo?.framesPerSecond || outboundVideo?.framesPerSecond || 0;
        const jitterMs = Math.max(
            (inboundVideo?.jitter || 0) * 1000,
            (inboundAudio?.jitter || 0) * 1000);
        const resolutionKpx =
            inboundVideo?.frameWidth && inboundVideo?.frameHeight ?
            inboundVideo.frameWidth * inboundVideo.frameHeight / 1000 :
            0;
        const rttMs =
            candidatePair?.currentRoundTripTime != null ?
            candidatePair.currentRoundTripTime * 1000 :
            null;
        const qp =
            inboundVideo?.qpSum != null && inboundVideo?.framesDecoded ?
            inboundVideo.qpSum / Math.max(1, inboundVideo.framesDecoded) :
            0;

        const now = performance.now();
        let bitrateKbps = 0;
        let lossPercent = 0;
        if (statsBaseline) {
          const elapsedMs = Math.max(1, now - statsBaseline.time);
          const bytesDelta =
              (bytesSent + bytesReceived) -
              (statsBaseline.bytesSent + statsBaseline.bytesReceived);
          bitrateKbps = bytesDelta * 8 / elapsedMs;

          const packetsDelta = packetsReceived - statsBaseline.packetsReceived;
          const lossDelta = packetsLost - statsBaseline.packetsLost;
          const totalPackets = Math.max(0, packetsDelta + lossDelta);
          lossPercent = totalPackets > 0 ? (lossDelta / totalPackets) * 100 : 0;
        }

        statsBaseline = {
          bytesReceived,
          bytesSent,
          packetsLost,
          packetsReceived,
          time: now,
        };

        const videoCodec = codecName(inboundVideo || outboundVideo, statsMap);
        const audioCodec = codecName(inboundAudio || outboundAudio, statsMap);

        pushHistory(bitrateHistory, bitrateKbps);
        pushHistory(qpHistory, qp);
        pushHistory(lossHistory, lossPercent);
        pushHistory(jitterHistory, jitterMs);
        pushHistory(resolutionHistory, resolutionKpx);
        pushHistory(fpsHistory, fps);

        updateStatsDisplay({
          audioCodec,
          audioPacketsSent: outboundAudio?.packetsSent || 0,
          audioPacketsRecv: inboundAudio?.packetsReceived || 0,
          bitrateKbps,
          fps,
          jitterMs,
          lossPercent,
          packetsReceived,
          packetsSent,
          qp,
          resolution: formatResolution(
              inboundVideo?.frameWidth || remoteVideo.videoWidth ||
                  outboundVideo?.frameWidth || localVideo.videoWidth,
              inboundVideo?.frameHeight || remoteVideo.videoHeight ||
                  outboundVideo?.frameHeight || localVideo.videoHeight),
          rttMs,
          videoCodec,
        });
      } catch (error) {
        log(`Stats polling failed: ${error.message}`, 'warn');
      }
    }

    function startStatsPolling() {
      if (statsInterval) {
        return;
      }
      statsPanelEl.hidden = false;
      pollStats();
      statsInterval = setInterval(pollStats, 1000);
    }

    function updateButtonState() {
      btnJoin.disabled = joinedRoom;
      btnCall.disabled = !joinedRoom || !remotePeerId || !!pc;
      btnHangup.disabled = !pc;
      roomInput.disabled = joinedRoom;

      const inCall = !!pc;
      videoCodecEl.disabled = inCall;
      audioCodecEl.disabled = inCall;
      resolutionEl.disabled = inCall;
    }

    function createPeerConnection() {
      pendingCandidates = [];
      remoteDescriptionSet = false;
      pc = new RTCPeerConnection({
        iceServers: [{urls: 'stun:stun.l.google.com:19302'}],
      });
      setStatus('Connecting', 'connecting');
      log('RTCPeerConnection created');

      pc.onicecandidate = (event) => {
        if (!event.candidate || !ws || !remotePeerId) {
          if (!event.candidate) {
            log('ICE gathering complete');
          }
          return;
        }
        ws.send(JSON.stringify({
          type: 'ice-candidate',
          candidate: {
            candidate: event.candidate.candidate,
            sdpMid: event.candidate.sdpMid,
            sdpMLineIndex: event.candidate.sdpMLineIndex,
          },
          target: remotePeerId,
        }));
        log(`Sent ICE candidate to ${remotePeerId}`);
      };

      pc.onicegatheringstatechange = () => {
        log(`ICE gathering state: ${pc.iceGatheringState}`);
      };

      pc.oniceconnectionstatechange = () => {
        log(`ICE connection state: ${pc.iceConnectionState}`);
        if (pc.iceConnectionState === 'connected' ||
            pc.iceConnectionState === 'completed') {
          setStatus('Connected', 'connected');
          startStatsPolling();
        } else if (pc.iceConnectionState === 'failed') {
          setStatus('Connection failed', 'connecting');
        }
      };

      pc.onconnectionstatechange = () => {
        log(`Connection state: ${pc.connectionState}`);
        if (pc.connectionState === 'connected') {
          setStatus('Connected', 'connected');
          startStatsPolling();
        } else if (pc.connectionState === 'connecting') {
          setStatus('Connecting', 'connecting');
        } else if (
          pc.connectionState === 'failed' || pc.connectionState === 'disconnected'
        ) {
          setStatus('Disconnected', 'connecting');
        } else if (pc.connectionState === 'closed') {
          setStatus('Idle', 'idle');
        }
      };

      pc.onsignalingstatechange = () => {
        log(`Signaling state: ${pc.signalingState}`);
      };

      pc.ontrack = async (event) => {
        log(`Remote ${event.track.kind} track received`);
        if (event.track.kind === 'video') {
          if (event.streams && event.streams[0]) {
            remoteVideo.srcObject = event.streams[0];
          } else {
            const stream = remoteVideo.srcObject || new MediaStream();
            stream.addTrack(event.track);
            remoteVideo.srcObject = stream;
          }
          await remoteVideo.play().catch(() => {});
        } else if (event.track.kind === 'audio') {
          if (event.streams && event.streams[0]) {
            remoteAudio.srcObject = event.streams[0];
          } else {
            const stream = remoteAudio.srcObject || new MediaStream();
            stream.addTrack(event.track);
            remoteAudio.srcObject = stream;
          }
          await remoteAudio.play().catch(() => {});
        }

        event.track.onmute = () => log(`Remote ${event.track.kind} track muted`, 'warn');
        event.track.onunmute = () => log(`Remote ${event.track.kind} track unmuted`);
        event.track.onended = () => log(`Remote ${event.track.kind} track ended`, 'warn');
      };

      pc.ondatachannel = (event) => {
        log(`Data channel received: ${event.channel.label}`);
      };

      updateButtonState();
      return pc;
    }

    async function flushPendingCandidates() {
      remoteDescriptionSet = true;
      log(`Flushing ${pendingCandidates.length} queued ICE candidate(s)`);
      for (const candidate of pendingCandidates) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (error) {
          log(`Failed to flush ICE candidate: ${error.message}`, 'error');
        }
      }
      pendingCandidates = [];
    }

    async function handleIceCandidate(candidate) {
      if (!candidate?.candidate) {
        return;
      }

      if (pc && remoteDescriptionSet) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(candidate));
          log('Added remote ICE candidate');
        } catch (error) {
          log(`Failed to add ICE candidate: ${error.message}`, 'error');
        }
        return;
      }

      pendingCandidates.push(candidate);
      log(`Queued ICE candidate (${pendingCandidates.length} pending)`);
    }

    function addLocalTracks(stream) {
      stream.getTracks().forEach((track) => pc.addTrack(track, stream));
    }

    async function startCall() {
      createPeerConnection();
      const stream = await acquireLocalStream();
      addLocalTracks(stream);

      let offer = await pc.createOffer();
      offer = applyCodecPreferencesToDescription(offer);
      await pc.setLocalDescription(offer);
      console.log('[PeerC] Offer SDP:', offer.sdp);

      ws.send(JSON.stringify({
        type: 'offer',
        sdp: offer.sdp,
        target: remotePeerId,
      }));
      log(`Sent offer to ${remotePeerId}`);
      updateButtonState();
    }

    async function handleOffer(sdp, from) {
      remotePeerId = from;
      createPeerConnection();

      const stream = await acquireLocalStream();
      addLocalTracks(stream);

      log(`Received offer from ${from}`);
      await pc.setRemoteDescription({type: 'offer', sdp});
      await flushPendingCandidates();

      let answer = await pc.createAnswer();
      answer = applyCodecPreferencesToDescription(answer);
      await pc.setLocalDescription(answer);
      console.log('[PeerC] Answer SDP:', answer.sdp);

      ws.send(JSON.stringify({
        type: 'answer',
        sdp: answer.sdp,
        target: remotePeerId,
      }));
      log(`Sent answer to ${remotePeerId}`);
      updateButtonState();
    }

    async function handleAnswer(sdp) {
      log('Received answer');
      await pc.setRemoteDescription({type: 'answer', sdp});
      await flushPendingCandidates();
    }

    function cleanupMedia() {
      if (localStream) {
        localStream.getTracks().forEach((track) => track.stop());
        localStream = null;
      }
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
      remoteAudio.srcObject = null;
    }

    function hangup() {
      stopStatsPolling();
      resetStatsUi();

      if (pc) {
        pc.close();
        pc = null;
      }

      cleanupMedia();
      pendingCandidates = [];
      remoteDescriptionSet = false;
      statsBaseline = null;

      if (joinedRoom) {
        setStatus(remotePeerId ? 'Ready' : 'Waiting for peer', 'connecting');
      } else {
        setStatus('Idle', 'idle');
      }
      updateButtonState();
      log('Call ended');
    }

    function attachSocketHandlers() {
      ws.onopen = () => {
        ws.send(JSON.stringify({type: 'join', room: roomInput.value.trim()}));
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        switch (msg.type) {
          case 'joined':
            joinedRoom = true;
            peerId = msg.peerId;
            remotePeerId = msg.peers.length ? msg.peers[0] : null;
            setStatus(remotePeerId ? 'Ready' : 'Waiting for peer', 'connecting');
            log(`Joined room as ${peerId}`);
            updateButtonState();
            break;
          case 'peer-joined':
            remotePeerId = msg.peerId;
            setStatus('Ready', 'connecting');
            log(`Peer joined: ${msg.peerId}`);
            updateButtonState();
            break;
          case 'peer-left':
            log(`Peer left: ${msg.peerId || remotePeerId || 'unknown'}`, 'warn');
            remotePeerId = null;
            if (pc) {
              hangup();
            }
            setStatus('Waiting for peer', 'connecting');
            updateButtonState();
            break;
          case 'offer':
            await handleOffer(msg.sdp, msg.from);
            break;
          case 'answer':
            await handleAnswer(msg.sdp);
            break;
          case 'ice-candidate':
            await handleIceCandidate(msg.candidate);
            break;
          default:
            log(`Ignoring message type: ${msg.type}`, 'warn');
            break;
        }
      };

      ws.onerror = () => {
        log('WebSocket error', 'error');
      };

      ws.onclose = () => {
        joinedRoom = false;
        remotePeerId = null;
        if (pc) {
          hangup();
        } else {
          resetStatsUi();
          cleanupMedia();
        }
        setStatus('Disconnected', 'idle');
        updateButtonState();
        log('WebSocket closed', 'warn');
      };
    }

    btnJoin.addEventListener('click', () => {
      const room = roomInput.value.trim();
      if (!room || joinedRoom) {
        return;
      }
      ws = new WebSocket(`ws://${window.location.host}`);
      attachSocketHandlers();
      setStatus('Joining', 'connecting');
      log(`Joining room "${room}"`);
    });

    btnCall.addEventListener('click', async () => {
      if (!remotePeerId) {
        log('No remote peer in room yet', 'warn');
        return;
      }
      try {
        await startCall();
      } catch (error) {
        log(`Call failed: ${error.message}`, 'error');
        hangup();
      }
    });

    btnHangup.addEventListener('click', () => {
      hangup();
    });

    btnToggleGraphs.addEventListener('click', () => {
      graphsVisible = !graphsVisible;
      graphsPanelEl.classList.toggle('visible', graphsVisible);
      btnToggleGraphs.textContent = graphsVisible ? 'Hide Graphs' : 'Show Graphs';
      if (graphsVisible && !graphFrame) {
        renderGraphs();
      } else if (!graphsVisible && graphFrame) {
        window.cancelAnimationFrame(graphFrame);
        graphFrame = 0;
      }
    });

    updateButtonState();
    resetStatsUi();
    log('PeerConnection Client ready.');
  </script>
</body>
